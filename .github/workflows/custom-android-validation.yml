name: Custom Android compile validation

on:
  push:
    branches: [dev]
    paths: ['.github/custom-validation/request.json']

permissions:
  contents: read

concurrency:
  group: custom-android-compile-validation
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'csbxd/sing-box-for-android' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.request.outputs.skip }}
      app_commit: ${{ steps.request.outputs.app_commit }}
      core_commit: ${{ steps.request.outputs.core_commit }}
      core_version: ${{ steps.request.outputs.core_version }}
      go_version: ${{ steps.request.outputs.go_version }}
      version_code: ${{ steps.request.outputs.version_code }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: csbxd/sing-box
          ref: custom-dev
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Test helpers and validate immutable source request
        id: request
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 -m py_compile .github/scripts/*.py
          bash -n .github/scripts/compile_unsigned_apks.sh
          python3 .github/scripts/read_compile_request.py

  library:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64, arm, arm64]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.plan.outputs.app_commit }}
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: csbxd/sing-box
          ref: ${{ needs.plan.outputs.core_commit }}
          path: core
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ needs.plan.outputs.go_version }}
          cache: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Android SDK and pinned NDK
        run: bash .github/scripts/setup_android_sdk.sh
      - name: Build both release AAR variants for exact custom core
        working-directory: core
        env:
          SING_BOX_BUILD_VERSION: ${{ needs.plan.outputs.core_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          grep -q 'SING_BOX_BUILD_VERSION' cmd/internal/build_shared/tag.go
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform "android/$ARCH"
          mkdir -p "dist/$ARCH"
          mv libbox.aar libbox-legacy.aar "dist/$ARCH/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-libbox-${{ matrix.arch }}
          path: core/dist
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  compile:
    needs: [plan, library]
    if: needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.plan.outputs.app_commit }}
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: csbxd/sing-box
          ref: ${{ needs.plan.outputs.core_commit }}
          path: core
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validation-libbox-*
          path: libbox-inputs
          merge-multiple: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ needs.plan.outputs.go_version }}
          cache: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Android SDK and pinned NDK
        run: bash .github/scripts/setup_android_sdk.sh
      - name: Merge exact four-ABI release libraries
        working-directory: core
        run: |
          mkdir -p ../app/libs
          go run ./cmd/internal/merge_aar -output ../app/libs/libbox.aar ../libbox-inputs/*/libbox.aar
          go run ./cmd/internal/merge_aar -output ../app/libs/libbox-legacy.aar ../libbox-inputs/*/libbox-legacy.aar
      - name: Compile and test both unsigned release variants without secrets
        env:
          CUSTOM_ANDROID_COMPILE_CHECK: 'true'
          CUSTOM_COMPILE_VERSION_NAME: ${{ needs.plan.outputs.core_version }}
          CUSTOM_COMPILE_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: bash .github/scripts/compile_unsigned_apks.sh
      # Deliberately no APK upload, release, tag or signing step.
